<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif" style="background:#0D1117">
  <title>ER diagram databáze Game Tracker</title>

  <rect width="680" height="420" fill="#0D1117"/>

  <!-- PLATFORMS -->
  <rect x="40" y="60" width="180" height="130" rx="10" fill="#161B22" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="40" y="60" width="180" height="36" rx="10" fill="#7C3AED"/>
  <rect x="40" y="80" width="180" height="16" fill="#7C3AED"/>
  <text x="130" y="84" text-anchor="middle" fill="white" font-size="13" font-weight="bold">platforms</text>
  <line x1="40" y1="96" x2="220" y2="96" stroke="#21262D" stroke-width="1"/>
  <text x="56" y="116" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
  <text x="80" y="116" fill="#E5E7EB" font-size="12">id</text>
  <text x="160" y="116" fill="#6B7280" font-size="11">SERIAL</text>
  <line x1="40" y1="126" x2="220" y2="126" stroke="#21262D" stroke-width="1"/>
  <text x="80" y="146" fill="#E5E7EB" font-size="12">name</text>
  <text x="160" y="146" fill="#6B7280" font-size="11">TEXT</text>
  <text x="80" y="164" fill="#4ADE80" font-size="10">UNIQUE NOT NULL</text>

  <!-- GAMES -->
  <rect x="260" y="40" width="190" height="190" rx="10" fill="#161B22" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="260" y="40" width="190" height="36" rx="10" fill="#0369A1"/>
  <rect x="260" y="60" width="190" height="16" fill="#0369A1"/>
  <text x="355" y="64" text-anchor="middle" fill="white" font-size="13" font-weight="bold">games</text>
  <line x1="260" y1="76" x2="450" y2="76" stroke="#21262D" stroke-width="1"/>
  <text x="276" y="96" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
  <text x="300" y="96" fill="#E5E7EB" font-size="12">id</text>
  <text x="380" y="96" fill="#6B7280" font-size="11">SERIAL</text>
  <line x1="260" y1="106" x2="450" y2="106" stroke="#21262D" stroke-width="1"/>
  <text x="300" y="126" fill="#E5E7EB" font-size="12">title</text>
  <text x="380" y="126" fill="#6B7280" font-size="11">TEXT</text>
  <line x1="260" y1="136" x2="450" y2="136" stroke="#21262D" stroke-width="1"/>
  <text x="276" y="156" fill="#C084FC" font-size="11" font-weight="bold">FK</text>
  <text x="300" y="156" fill="#E5E7EB" font-size="12">platform_id</text>
  <text x="380" y="156" fill="#6B7280" font-size="11">INT</text>
  <line x1="260" y1="166" x2="450" y2="166" stroke="#21262D" stroke-width="1"/>
  <text x="300" y="186" fill="#E5E7EB" font-size="12">release_year</text>
  <text x="400" y="186" fill="#6B7280" font-size="11">INT?</text>
  <line x1="260" y1="196" x2="450" y2="196" stroke="#21262D" stroke-width="1"/>
  <text x="300" y="216" fill="#E5E7EB" font-size="12">note</text>
  <text x="380" y="216" fill="#6B7280" font-size="11">TEXT</text>

  <!-- GAME_SESSIONS -->
  <rect x="490" y="60" width="170" height="210" rx="10" fill="#161B22" stroke="#4ADE80" stroke-width="1.5"/>
  <rect x="490" y="60" width="170" height="36" rx="10" fill="#166534"/>
  <rect x="490" y="80" width="170" height="16" fill="#166534"/>
  <text x="575" y="84" text-anchor="middle" fill="white" font-size="12" font-weight="bold">game_sessions</text>
  <line x1="490" y1="96" x2="660" y2="96" stroke="#21262D" stroke-width="1"/>
  <text x="506" y="116" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
  <text x="530" y="116" fill="#E5E7EB" font-size="12">id</text>
  <text x="610" y="116" fill="#6B7280" font-size="11">SERIAL</text>
  <line x1="490" y1="126" x2="660" y2="126" stroke="#21262D" stroke-width="1"/>
  <text x="506" y="146" fill="#C084FC" font-size="11" font-weight="bold">FK</text>
  <text x="530" y="146" fill="#E5E7EB" font-size="12">game_id</text>
  <text x="610" y="146" fill="#6B7280" font-size="11">INT</text>
  <line x1="490" y1="156" x2="660" y2="156" stroke="#21262D" stroke-width="1"/>
  <text x="530" y="176" fill="#E5E7EB" font-size="12">played_on</text>
  <text x="610" y="176" fill="#6B7280" font-size="11">DATE</text>
  <line x1="490" y1="186" x2="660" y2="186" stroke="#21262D" stroke-width="1"/>
  <text x="530" y="206" fill="#E5E7EB" font-size="12">hours_played</text>
  <text x="625" y="206" fill="#6B7280" font-size="10">NUM</text>
  <line x1="490" y1="216" x2="660" y2="216" stroke="#21262D" stroke-width="1"/>
  <text x="530" y="236" fill="#E5E7EB" font-size="12">note</text>
  <text x="610" y="236" fill="#6B7280" font-size="11">TEXT</text>
  <line x1="490" y1="246" x2="660" y2="246" stroke="#21262D" stroke-width="1"/>
  <text x="530" y="262" fill="#F87171" font-size="10">ON DELETE CASCADE</text>

  <!-- platforms → games -->
  <line x1="220" y1="116" x2="260" y2="151" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="226" y="113" fill="#7C3AED" font-size="11" font-weight="bold">1</text>
  <text x="240" y="148" fill="#7C3AED" font-size="11" font-weight="bold">N</text>

  <!-- games → game_sessions -->
  <line x1="450" y1="96" x2="490" y2="141" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="455" y="94" fill="#38BDF8" font-size="11" font-weight="bold">1</text>
  <text x="468" y="138" fill="#38BDF8" font-size="11" font-weight="bold">N</text>

  <!-- Legenda -->
  <rect x="40" y="340" width="600" height="60" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1"/>
  <text x="60" y="362" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
  <text x="78" y="362" fill="#9CA3AF" font-size="11">Primary Key</text>
  <text x="170" y="362" fill="#C084FC" font-size="11" font-weight="bold">FK</text>
  <text x="188" y="362" fill="#9CA3AF" font-size="11">Foreign Key</text>
  <text x="290" y="362" fill="#6B7280" font-size="11">INT?</text>
  <text x="320" y="362" fill="#9CA3AF" font-size="11">= nullable (nepovinné)</text>
  <text x="60" y="385" fill="#F87171" font-size="11">ON DELETE CASCADE</text>
  <text x="185" y="385" fill="#9CA3AF" font-size="11">= smazání hry smaže i všechny její relace</text>
</svg>
